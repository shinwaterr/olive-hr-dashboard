<title>올리브인터 HR 대시보드</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>


  :root{
    --app-backdrop:#E6E9F1;
    --sidebar-bg:#FFFFFF;
    --content-bg:#EEF0F6;
    --card-bg:#FFFFFF;
    --track-bg:#EEF0F6;
    --border:#E7E9F2;
    --border-soft:#EFF1F7;
    --ink:#20232D;
    --ink-secondary:#6C7180;
    --ink-muted:#9DA1B0;

    --green:#22C55E; --green-soft:#E3FBEA; --green-strong:#189248;
    --blue:#4F7FFF; --blue-soft:#EAF0FF; --blue-strong:#3860D6;
    --critical:#EF5A52; --critical-soft:#FDEBEA;
    --warning:#F5A524; --warning-soft:#FDF2DF;

    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#c9880a; --cat-5:#d1699a; --cat-6:#008300;

    --org-1:#22774F; --org-2:#2E9E6A; --org-3:#39C684; --org-4:#61D19D; --org-5:#90DFBA;
    --bu-1:#1B6B45; --bu-2:#22774F; --bu-3:#27865A; --bu-4:#2E9E6A; --bu-5:#39C684; --bu-6:#61D19D; --bu-7:#90DFBA;

    --chip-active-bg:#20232D; --chip-active-fg:#FFFFFF;

    --shadow: 0 1px 2px rgba(32,35,45,0.04), 0 10px 28px -10px rgba(32,35,45,0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --app-backdrop:#08090C; --sidebar-bg:#15161C; --content-bg:#101116; --card-bg:#1A1B22;
      --track-bg:#24262E; --border:#2A2C36; --border-soft:#24262F;
      --ink:#F1F2F6; --ink-secondary:#B4B7C4; --ink-muted:#7D8091;
      --green:#3ED17A; --green-soft:#173322; --green-strong:#6EE39A;
      --blue:#6E93FF; --blue-soft:#1B2440; --blue-strong:#9AB2FF;
      --critical:#F16C64; --critical-soft:#33201F;
      --warning:#F6B750; --warning-soft:#332A16;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300;
      --org-1:#2E9E6A; --org-2:#39C684; --org-3:#59CF98; --org-4:#79D8AB; --org-5:#A0E3C4;
      --bu-1:#2A8F5E; --bu-2:#2E9E6A; --bu-3:#32AE74; --bu-4:#39C684; --bu-5:#59CF98; --bu-6:#79D8AB; --bu-7:#A0E3C4;
      --chip-active-bg:#F1F2F6; --chip-active-fg:#14151C;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 32px -12px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --app-backdrop:#08090C; --sidebar-bg:#15161C; --content-bg:#101116; --card-bg:#1A1B22;
    --track-bg:#24262E; --border:#2A2C36; --border-soft:#24262F;
    --ink:#F1F2F6; --ink-secondary:#B4B7C4; --ink-muted:#7D8091;
    --green:#3ED17A; --green-soft:#173322; --green-strong:#6EE39A;
    --blue:#6E93FF; --blue-soft:#1B2440; --blue-strong:#9AB2FF;
    --critical:#F16C64; --critical-soft:#33201F;
    --warning:#F6B750; --warning-soft:#332A16;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300;
    --org-1:#2E9E6A; --org-2:#39C684; --org-3:#59CF98; --org-4:#79D8AB; --org-5:#A0E3C4;
    --bu-1:#2A8F5E; --bu-2:#2E9E6A; --bu-3:#32AE74; --bu-4:#39C684; --bu-5:#59CF98; --bu-6:#79D8AB; --bu-7:#A0E3C4;
    --chip-active-bg:#F1F2F6; --chip-active-fg:#14151C;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 32px -12px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--app-backdrop);
    color:var(--ink);
    font-family:"IBM Plex Sans KR","IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
    font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:20px;
  }
  .num{ font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace; font-variant-numeric:tabular-nums; }
  a{color:inherit; text-decoration:none;}
  html{ scroll-behavior:smooth; }

  .app-shell{
    max-width:1280px; margin:0 auto; display:flex; gap:0;
    background:var(--content-bg); border-radius:24px; overflow:hidden;
    box-shadow:var(--shadow); min-height:860px;
  }

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:216px; flex:none; background:var(--sidebar-bg); padding:22px 16px;
    display:flex; flex-direction:column; border-right:1px solid var(--border);
  }
  .brand-row{ padding:4px 6px 18px; }
  .brand-logo{ height:30px; width:auto; display:block; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-logo{ filter:invert(1); } }
  :root[data-theme="dark"] .brand-logo{ filter:invert(1); }
  .brand-row .subtitle{ font-size:11px; color:var(--ink-muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin:6px 0 0 2px; }

  /* ============ MONTH SWITCHER (sidebar) ============ */
  .month-switcher{ position:relative; margin-bottom:18px; }
  .ms-trigger{
    appearance:none; width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px;
    border-radius:12px; background:var(--content-bg); border:1px solid transparent; cursor:pointer;
    font:inherit; text-align:left;
  }
  .ms-trigger:hover{ border-color:var(--border); }
  .ms-trigger .ms-icon{ font-size:15px; flex:none; line-height:1; }
  .ms-trigger .ms-label{ font-size:13px; font-weight:600; color:var(--ink); flex:1; }
  .ms-trigger .chev{ color:var(--ink-muted); font-size:10px; transition:transform .15s ease; }
  .month-switcher.open .ms-trigger .chev{ transform:rotate(180deg); }

  .ms-panel{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:30;
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
    padding:6px; opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
  }
  .month-switcher.open .ms-panel{ opacity:1; visibility:visible; transform:none; }
  .ms-list{ max-height:190px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .ms-row{
    appearance:none; border:none; background:transparent; width:100%; text-align:left; cursor:pointer;
    font:inherit; font-size:13px; color:var(--ink-secondary); padding:9px 10px; border-radius:9px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .ms-row:hover{ background:var(--content-bg); }
  .ms-row.active{ background:var(--green-soft); color:var(--green-strong); font-weight:700; }
  .ms-row.disabled{ color:var(--ink-muted); cursor:default; font-style:italic; }
  .ms-row.disabled:hover{ background:transparent; }
  .ms-row .check{ font-size:12px; }

  nav.navlist{ display:flex; flex-direction:column; gap:2px; }
  .navitem{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px;
    font-size:13.5px; font-weight:500; color:var(--ink-secondary); cursor:pointer; border:none;
    background:transparent; width:100%; text-align:left; font-family:inherit;
  }
  .navitem .ic{ width:16px; text-align:center; flex:none; font-size:14px; }
  .navitem:hover{ background:var(--content-bg); }
  .navitem.active{ background:var(--green); color:#fff; }
  .navitem.active .ic{ filter:none; }

  .sidebar-spacer{ flex:1; }
  .sidebar-foot{ font-size:12px; color:var(--ink-muted); padding:10px 12px; display:flex; align-items:center; gap:6px; }

  /* ============ CONTENT ============ */
  .content{ flex:1; min-width:0; padding:22px 26px 40px; }
  .content-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .content-header h1{ font-size:18px; font-weight:700; margin:0; }
  .content-header .meta{ font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .live-refresh{ display:flex; align-items:center; gap:10px; }
  .live-status{ font-size:11.5px; color:var(--ink-muted); }
  .refresh-icon-btn{
    appearance:none; border:1px solid var(--border); background:var(--card-bg); cursor:pointer;
    width:30px; height:30px; border-radius:50%; font-size:15px; line-height:1; color:var(--ink-secondary);
    display:flex; align-items:center; justify-content:center; padding:0; flex:none;
  }
  .refresh-icon-btn:hover{ color:var(--chip-active-fg); background:var(--chip-active-bg); border-color:var(--chip-active-bg); }
  .refresh-icon-btn:disabled{ opacity:.6; cursor:default; }
  .btn-spinner{
    width:16px; height:16px; border-radius:50%; flex:none;
    border:2px solid currentColor; border-top-color:transparent;
    opacity:.6; animation:btn-spin .7s linear infinite;
  }
  @keyframes btn-spin{ to{ transform:rotate(360deg); } }

  .month-picker{ display:flex; align-items:center; gap:6px; }
  .month-chip{
    appearance:none; border:1px solid var(--border); background:var(--card-bg); cursor:pointer;
    padding:7px 14px; border-radius:100px; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-secondary);
  }
  .month-chip.active{ background:var(--chip-active-bg); color:var(--chip-active-fg); border-color:var(--chip-active-bg); }
  .month-chip-empty{ padding:7px 14px; border-radius:100px; font-size:12px; color:var(--ink-muted); border:1px dashed var(--border); }
  .sample-tag{ font-size:11px; font-weight:600; color:var(--warning); background:var(--warning-soft); padding:3px 9px; border-radius:100px; margin-left:8px; }

  /* notice row */
  .notice-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
  @media (max-width:760px){ .notice-row{ grid-template-columns:1fr; } }
  .notice{
    background:var(--card-bg); border:1px solid var(--border); border-radius:16px;
    padding:14px 18px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow);
  }
  .notice .tag{ font-size:12px; font-weight:700; color:var(--blue); flex:none; }
  .notice .txt{ font-size:13px; color:var(--ink); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .notice .date{ font-size:12px; color:var(--ink-muted); flex:none; }

  .card{ background:var(--card-bg); border:1px solid var(--border); border-radius:18px; padding:20px 20px 18px; box-shadow:var(--shadow); transition:transform .12s ease, box-shadow .12s ease; }
  .card:not(.zoomed){ cursor:zoom-in; }
  .card:not(.zoomed):hover{ transform:translateY(-2px); box-shadow:0 4px 16px -4px rgba(32,35,45,0.16), var(--shadow); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card:not(.zoomed):hover{ box-shadow:0 4px 20px -4px rgba(0,0,0,0.5), var(--shadow); } }
  :root[data-theme="dark"] .card:not(.zoomed):hover{ box-shadow:0 4px 20px -4px rgba(0,0,0,0.5), var(--shadow); }

  /* ============ CARD ZOOM MODAL ============ */
  .card-modal-backdrop{
    position:fixed; inset:0; background:rgba(10,11,15,0.58); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:5vh 24px; z-index:100;
    opacity:0; visibility:hidden; transition:opacity .16s ease, visibility .16s;
  }
  .card-modal-backdrop.open{ opacity:1; visibility:visible; }
  .card-modal-shell{
    position:relative; width:100%; max-width:820px; max-height:90vh; overflow-y:auto;
    border-radius:20px; transform:scale(.97) translateY(6px); transition:transform .16s ease;
  }
  .card-modal-backdrop.open .card-modal-shell{ transform:none; }
  .card-modal-close{
    position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
    background:var(--track-bg); border:1px solid var(--border); color:var(--ink); font-size:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .card-modal-close:hover{ background:var(--border); }
  .card-modal-slot .card{ cursor:default; box-shadow:none; border-radius:20px; }
  .card-modal-slot .card:hover{ transform:none; box-shadow:none; }

  /* enlarged proportions while a card sits inside the modal */
  .card.zoomed{ padding:32px 34px 30px; }
  .card.zoomed .card-head h3{ font-size:20px; }
  .card.zoomed .card-sub{ font-size:12.5px; margin-bottom:20px; }
  .card.zoomed .card-note{ font-size:12px; }
  .card.zoomed .hc-total .hc-num{ font-size:44px; }
  .card.zoomed .hc-total .hc-num .u{ font-size:17px; }
  .card.zoomed .donut-wrap{ width:168px; height:168px; }
  .card.zoomed .donut-center .pct{ font-size:30px; }
  .card.zoomed .donut-center .lbl{ font-size:12.5px; }
  .card.zoomed .stat2x2 .cell .n{ font-size:23px; }
  .card.zoomed .stat2x2{ gap:16px 20px; }
  .card.zoomed .bar-row{ grid-template-columns:100px 1fr 60px; }
  .card.zoomed .bar-track{ height:15px; border-radius:7.5px; }
  .card.zoomed .bar-fill{ border-radius:7.5px; }
  .card.zoomed .list-scroll{ max-height:440px; }
  .card.zoomed .stat-list .row .v{ font-size:17px; }
  .card.zoomed table.simple-table{ font-size:14px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  #sec-overtime.grid-2{ align-items:start; }
  #sec-turnover.grid-2{ align-items:stretch; }
  #sec-turnover.grid-2 .card:has(#turnoverDetailMount){ height:344px; display:flex; flex-direction:column; overflow:hidden; }
  #sec-turnover.grid-2 #turnoverDetailMount{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  #sec-turnover.grid-2 #turnoverDetailMount .table-scroll{ flex:1 1 auto; overflow-y:auto; min-height:0; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px; }
  .tabpanel > .card + .card{ margin-top:14px; }
  @media (max-width:900px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

  .card-head{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .card-head h3{ font-size:15px; font-weight:700; margin:0; }
  .card-head .info{ width:15px; height:15px; border-radius:50%; background:var(--track-bg); color:var(--ink-muted); font-size:10px; display:flex; align-items:center; justify-content:center; cursor:help; }
  .card-sub{ font-size:11.5px; color:var(--ink-muted); margin:2px 0 14px; }
  .card-note{ font-size:11px; color:var(--ink-muted); margin:14px 0 0; }

  /* ============ FUNNEL CARD (donut + stats) ============ */
  .funnel-body{ display:flex; gap:18px; align-items:center; }
  .donut-wrap{ position:relative; width:118px; height:118px; flex:none; }
  .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-center .pct{ font-size:22px; font-weight:700; letter-spacing:-0.02em; }
  .donut-center .lbl{ font-size:11px; color:var(--ink-secondary); font-weight:600; margin-top:2px; }

  .stat2x2{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .stat2x2 .cell .n{ font-size:18px; font-weight:700; }
  .stat2x2 .cell .l{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }

  .funnel-legend{ display:flex; flex-wrap:wrap; gap:14px 16px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft); }
  .funnel-legend .item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-secondary); }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }

  /* ============ HEADCOUNT CARD (stat + bar chart) ============ */
  .hc-total{ display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .hc-total .hc-num{ font-size:30px; font-weight:700; letter-spacing:-0.02em; }
  .hc-total .hc-num .u{ font-size:14px; color:var(--ink-secondary); font-weight:500; margin-left:2px; }
  .hc-total .hc-delta{ font-size:12px; font-weight:600; padding:3px 9px; border-radius:100px; }
  .hc-total .hc-delta.up{ color:var(--green-strong); background:var(--green-soft); }
  .hc-total .hc-delta.down{ color:var(--critical); background:var(--critical-soft); }

  .barchart{ display:flex; flex-direction:column; gap:11px; }
  .card-head + :not(.card-sub){ margin-top:24px; }
  #tenureOrgBarchart{ position:relative; }
  #otOrgMount{ position:relative; }
  #laborVsRevenueChart{ position:relative; }
  #revenuePerHCChart{ position:relative; }
  #revenuePerHCChart .bar-row{ grid-template-columns:76px 1fr 72px; }
  .avg-ref-line{ position:absolute; top:0; bottom:0; width:0; border-left:2px dashed var(--warning); pointer-events:none; z-index:1; }
  .bar-row{ display:grid; grid-template-columns:76px 1fr 52px; align-items:center; gap:10px; }
  .bar-row .name{ font-size:12px; color:var(--ink-secondary); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ position:relative; height:12px; background:var(--track-bg); border-radius:6px; overflow:hidden; }
  .bar-fill{ position:absolute; inset:0 auto 0 0; height:100%; border-radius:6px; min-width:6px; }
  .bar-row .val{ font-size:12px; text-align:right; font-weight:700; }
  .bar-row .val .u{ font-size:10.5px; color:var(--ink-muted); font-weight:400; margin-left:1px; }
  .bar-row .val .pct-inline{ font-size:10.5px; color:var(--ink-muted); font-weight:500; }
  .barchart.wide-labels .bar-row{ grid-template-columns:112px 1fr 52px; }
  .barchart.wide-values .bar-row{ grid-template-columns:76px 1fr 72px; }
  .bar-row.highlight{ padding-bottom:9px; margin-bottom:2px; border-bottom:1px dashed var(--track-bg); }
  .bar-row.highlight .name{ color:var(--warning); font-weight:700; }
  .bar-row.highlight .val{ color:var(--warning); }

  /* ============ CHART CARD ============ */
  .segctl{ display:flex; gap:2px; background:var(--track-bg); border-radius:100px; padding:3px; }
  .segctl button{
    appearance:none; border:none; background:transparent; font:inherit; font-size:12px; font-weight:600;
    color:var(--ink-secondary); padding:6px 13px; border-radius:100px; cursor:pointer;
  }
  .segctl button.active{ background:var(--blue); color:#fff; }
  .chart-legend{ display:flex; gap:14px; margin:12px 0 4px; }
  .chart-legend .item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-secondary); }
  .line-sw{ width:12px; height:2.5px; border-radius:2px; }

  /* ============ SIMPLE LIST CARDS ============ */
  .list-scroll{ max-height:212px; overflow-y:auto; position:relative; margin-top:4px; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .list-row:last-child{ border-bottom:none; }
  .list-row .left{ display:flex; align-items:center; gap:8px; min-width:0; }
  .list-row .name{ font-weight:600; color:var(--ink); }
  .list-row .org{ font-size:11.5px; color:var(--ink-muted); }
  .list-row .right{ font-weight:600; flex:none; }
  .list-row .right.warn{ color:var(--critical); }
  .fade-mask{ position:absolute; left:0; right:0; bottom:0; height:26px; background:linear-gradient(to bottom, transparent, var(--card-bg)); pointer-events:none; }

  .stat-list .row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border-soft); }
  .stat-list .row:last-child{ border-bottom:none; }
  .stat-list .row .l{ font-size:13px; color:var(--ink-secondary); display:flex; align-items:center; gap:8px; }
  .stat-list .row .v{ font-size:15px; font-weight:700; }
  .stat-list .row .v .u{ font-size:11.5px; color:var(--ink-muted); font-weight:500; margin-left:1px; }

  .table-scroll{ overflow-x:auto; }
  table.simple-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:2px; }
  table.simple-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted); font-weight:600; padding:0 0 8px; border-bottom:1px solid var(--border); }
  table.simple-table th.r, table.simple-table td.r{ text-align:right; }
  table.simple-table td{ padding:10px 0; border-bottom:1px solid var(--border-soft); }
  table.simple-table tr:last-child td{ border-bottom:none; }

  details.formula{ margin-top:4px; }
  details.formula summary{ cursor:pointer; font-size:12px; color:var(--blue); font-weight:600; list-style:none; }
  details.formula summary::-webkit-details-marker{ display:none; }
  .formula-body{ margin-top:10px; padding:12px 14px; background:var(--track-bg); border-radius:10px; font-size:12px; color:var(--ink-secondary); line-height:1.7; }
  .formula-body .row{ display:flex; justify-content:space-between; padding:1px 0; }
  .formula-body .row.total{ border-top:1px solid var(--border); margin-top:5px; padding-top:7px; font-weight:700; color:var(--ink); }
  .formula-body .expr{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-muted); margin-top:7px; }

  .flag{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:100px; color:var(--warning); background:var(--warning-soft); }

  .hcroi-card .card-head h3{ font-size:17px; }
  .hcroi-card .card-sub{ font-size:13px; }
  .hcroi-card .flag{ font-size:12px; padding:3px 9px; }
  .hcroi-card .formula-body{ font-size:14.5px; line-height:1.85; padding:16px 18px; }
  .hcroi-card .formula-body .row.total{ font-size:16px; }
  .hcroi-card .formula-body .expr{ font-size:13px; }
  .hcroi-card .card-note{ font-size:12.5px; }
  .hcroi-compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:14px; }
  .hcroi-compare-grid .row.total .num{ color:var(--green-strong); }
  .hcroi-col-head{ font-size:14px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:7px; }
  @media (max-width:720px){ .hcroi-compare-grid{ grid-template-columns:1fr; } }

  .dep-toggle-btn{ font-size:11px; font-weight:600; color:var(--blue); background:var(--blue-soft); border:none; border-radius:100px; padding:4px 10px; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .dep-toggle-btn:hover{ background:var(--blue-strong); color:#fff; }

  .dep-modal-shell{ background:var(--card-bg); max-width:420px; padding:24px 24px 20px; box-shadow:0 16px 44px -10px rgba(0,0,0,0.35); }
  .dep-modal-title{ font-size:15px; font-weight:700; margin:0 0 14px; padding-right:30px; color:var(--ink); }
  .dep-modal-list{ max-height:min(52vh,440px); overflow-y:auto; }
  .dep-row{ padding:10px 2px; border-bottom:1px solid var(--border-soft); }
  .dep-row:last-child{ border-bottom:none; }
  .dep-row-name{ display:block; font-size:13.5px; font-weight:700; color:var(--ink); }
  .dep-row-dept{ display:block; font-size:12px; color:var(--ink-muted); margin-top:2px; }

  .vbar-chart{ display:flex; align-items:flex-end; justify-content:space-around; gap:10px; height:170px; padding-top:6px; }
  .vbar-col{ display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end; min-width:0; }
  .vbar-value{ font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:6px; white-space:nowrap; }
  .vbar-track{ width:100%; max-width:40px; flex:1; display:flex; align-items:flex-end; }
  .vbar-fill{ width:100%; border-radius:6px 6px 0 0; min-height:4px; transition:height .2s ease; }
  .vbar-label{ font-size:11px; color:var(--ink-muted); margin-top:8px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  footer.page-foot{ margin-top:22px; font-size:11.5px; color:var(--ink-muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  .panel{ display:none; }
  .panel.active{ display:block; }
  .tabpanel{ display:none; }
  .tabpanel.active{ display:block; }
  .trend-toggle-view{ display:none; }
  .trend-toggle-view.active{ display:block; }
  .trend-chart-wrap{ position:relative; }
  .trend-value-label{ position:absolute; transform:translate(-50%,-100%); font-size:12px; font-weight:600; white-space:nowrap; pointer-events:none; }
  .trend-axis-label{ position:absolute; bottom:2px; transform:translateX(-50%); font-size:9.5px; color:var(--ink-muted); white-space:nowrap; pointer-events:none; }

  .kpi-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:14px; }
  .kpi-tile{ background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:13px 14px; box-shadow:var(--shadow); }
  .kpi-tile.accent{ background:var(--green-soft); border-color:var(--green); }
  .kpi-tile .kpi-label{ font-size:10.5px; font-weight:600; color:var(--ink-muted); letter-spacing:.03em; text-transform:uppercase; margin-bottom:6px; white-space:nowrap; }
  .kpi-tile.accent .kpi-label{ color:var(--green-strong); }
  .kpi-tile .kpi-value{ font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  .kpi-tile .kpi-value .u{ font-size:12px; font-weight:500; color:var(--ink-secondary); margin-left:1px; }
  @media (max-width:900px){ .kpi-row{ grid-template-columns:repeat(4,1fr); } }
  @media (max-width:560px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:4px; }

  @media (max-width:860px){
    .app-shell{ flex-direction:column; border-radius:18px; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; flex-wrap:wrap; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar-spacer, .sidebar-foot{ display:none; }
    .month-switcher{ margin-bottom:0; width:180px; }
  }

  /* ============ MOBILE READABILITY ============ */
  @media (max-width:640px){
    .app-shell{ border-radius:0; min-height:0; }
    .sidebar{ padding:14px 14px 10px; gap:10px 0; }
    .brand-row{ padding:2px 4px 4px; flex:1 1 auto; }
    .month-switcher{ width:auto; flex:1 1 auto; min-width:150px; }
    nav.navlist{
      width:100%; flex-direction:row; flex-wrap:nowrap; gap:6px;
      overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;
      mask-image:linear-gradient(to right, #000 92%, transparent 100%);
      -webkit-mask-image:linear-gradient(to right, #000 92%, transparent 100%);
    }
    .navitem{ flex:none; width:auto; white-space:nowrap; padding:8px 12px; font-size:12.5px; }

    .content{ padding:16px 14px 32px; }
    .content-header{ flex-direction:column; align-items:flex-start; gap:10px; }
    .live-refresh{ width:100%; flex-wrap:wrap; gap:8px 10px; }
    .refresh-icon-btn{ flex:none; }
    .live-status{ flex:1 1 auto; }

    #turnoverDetailMount table.simple-table,
    #hireDetailMount table.simple-table{ min-width:460px; }
    #turnoverDetailMount table.simple-table th,
    #turnoverDetailMount table.simple-table td,
    #hireDetailMount table.simple-table th,
    #hireDetailMount table.simple-table td{ white-space:nowrap; }
    #turnoverDetailMount .table-scroll,
    #hireDetailMount .table-scroll{ overflow-x:auto; }
  }

  /* ============ LOGIN GATE ============ */
  .app-shell.gate-locked{ display:none; }
  .login-gate{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:var(--app-backdrop); }
  .login-gate.hidden{ display:none; }
  .login-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:18px; padding:38px 34px 30px; box-shadow:var(--shadow); width:300px; text-align:center; }
  .login-card .login-brand{ font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace; font-weight:700; font-size:16px; letter-spacing:0.02em; color:var(--ink); }
  .login-card .login-brand span{ display:block; font-size:9px; font-weight:500; letter-spacing:0.12em; color:var(--ink-muted); margin-top:1px; }
  .login-card h2{ margin:16px 0 4px; font-size:16px; font-weight:700; color:var(--ink); }
  .login-card p.login-sub{ margin:0 0 18px; font-size:12.5px; color:var(--ink-secondary); }
  .login-card input{ width:100%; box-sizing:border-box; padding:11px 13px; border-radius:10px; border:1px solid var(--border); background:var(--content-bg); color:var(--ink); font-size:14px; font-family:inherit; text-align:center; letter-spacing:0.2em; outline:none; }
  .login-card input:focus{ border-color:var(--blue); }
  .login-card button{ width:100%; margin-top:10px; padding:11px 13px; border:none; border-radius:10px; background:var(--blue); color:#fff; font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; }
  .login-card button:hover{ background:var(--blue-strong); }
  .login-card .login-error{ margin:10px 0 0; font-size:12px; color:var(--critical); }
